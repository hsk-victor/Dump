[package]
name = "dump-desktop"
version = "0.1.0"
description = "Dump desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dunce = "1"
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
arboard = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
